<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
    width="1024"
    height="500"
    viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9F4"/>
      <stop offset="1" stop-color="#F9E4D2"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#7C3300" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#background)"/>

  <!-- Low-contrast decorative shapes; all important content stays in the central safe area. -->
  <circle cx="970" cy="32" r="165" fill="#B4560A" opacity="0.07"/>
  <circle cx="42" cy="488" r="145" fill="#B4560A" opacity="0.06"/>
  <path d="M535 105 h34 M552 88 v34" stroke="#B4560A" stroke-width="10"
      stroke-linecap="round" opacity="0.14"/>
  <path d="M555 402 h38" stroke="#B4560A" stroke-width="10"
      stroke-linecap="round" opacity="0.14"/>

  <!-- Brand copy. -->
  <text x="92" y="214"
      font-family="Avenir Next, Avenir, Verdana, sans-serif"
      font-size="72"
      font-weight="700"
      letter-spacing="-2"
