  <text x="96" y="269"
      font-family="Avenir Next, Avenir, Verdana, sans-serif"
      font-size="34"
      font-weight="500"
      fill="#8D481A">Math Practice</text>

  <g transform="translate(96 307)">
    <rect width="316" height="52" rx="26" fill="#FFFFFF" opacity="0.82"/>
